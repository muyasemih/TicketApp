name: Build and Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build:
    name: Build & Test Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore TicketApp.csproj

      - name: Build Backend
        run: dotnet build TicketApp.csproj --no-restore --configuration Release

  frontend-build:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Angular
        working-directory: ./frontend
        run: npm run build --if-present

  docker-build:
    name: Verify Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Compose
        run: docker compose build
